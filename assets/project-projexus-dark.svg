<text x="24" y="94" style="font:400 12.5px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#e6edf3">Gestión de convocatorias de proyectos: equipos, evaluación por</text><text x="24" y="111" style="font:400 12.5px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#e6edf3">rúbricas y reconocimientos en PDF con QR.</text><text x="24" y="146" style="font:700 9.5px 'JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace;letter-spacing:2px;fill:#7d8590">MI PARTE</text><text x="24" y="166" style="font:400 12px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#e6edf3"><tspan fill="#818cf8">&#9656;</tspan><tspan dx="6">API en Spring Boot: convocatorias, equipos y rúbricas</tspan></text><text x="24" y="185" style="font:400 12px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#e6edf3"><tspan fill="#818cf8">&#9656;</tspan><tspan dx="6">Registro de jueces y restablecimiento de contraseña</tspan></text><text x="24" y="204" style="font:400 12px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#e6edf3"><tspan fill="#818cf8">&#9656;</tspan><tspan dx="6">Vistas de proyectos y dashboards en Next.js</tspan></text><line x1="24" y1="231" x2="456" y2="231" stroke="#30363d"/><text x="24" y="259" style="font:700 16px 'JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace;fill:#818cf8">17</text><text x="24" y="275" style="font:400 10px 'JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace;fill:#7d8590">Mis commits</text><text x="168" y="259" style="font:700 16px 'JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace;fill:#818cf8">Java 17</text><text x="168" y="275" style="font:400 10px 'JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace;fill:#7d8590">Backend</text><text x="312" y="259" style="font:700 16px 'JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace;fill:#818cf8">PDF + QR</text><text x="312" y="275" style="font:400 10px 'JetBrains Mono','Casca